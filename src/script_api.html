<script>
/**
 * 2. script_api.html
 * ส่วนติดต่อกับ Server (google.script.run) แปลงเป็น Promise เพื่อความง่าย
 */
const FS_API = {
  _call(fnName, ...args) {
    return new Promise((resolve, reject) => {
      google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(reject)
        [fnName](...args);
    });
  },

  authenticate: (u, p) => FS_API._call('authenticate', u, p),
  getDashboardData: (u, r, f) => FS_API._call('getDashboardData', u, r, f),
  getHistory: (u, r, q, s, e) => FS_API._call('getTransactionsHistory', u, r, q, s, e),
  getUsers: () => FS_API._call('getUsers'),
  saveTransaction: (d) => FS_API._call('saveTransaction', d),
  saveReceipt: (d) => FS_API._call('saveReceipt', d),
  voidTransaction: (id) => FS_API._call('voidTransactionInSheet', id),
  updateTransaction: (d) => FS_API._call('updateTransactionInSheet', d),
  addUser: (d) => FS_API._call('addUser', d),
  updateUser: (d) => FS_API._call('updateUser', d)
};
</script>
