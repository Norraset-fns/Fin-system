<script>
/**
 * 3. script_ui.html
 * การจัดการหน้าจอ, การแสดงผล (Rendering) และ Template
 */
const FS_UI = {
  // --- Navigation ---
  navigate(pageId) {
    const pages = ['page-login', 'page-dashboard', 'page-history', 'page-transaction', 'page-receipt', 'page-users'];
    if(pageId === 'dashboard') FS_UI.render.dashboard();
    if(pageId === 'history') FS_UI.render.history();
    if(pageId === 'users') FS_UI.render.users();

    pages.forEach(p => document.getElementById(p).classList.add('hidden-page'));
    document.getElementById('page-' + pageId).classList.remove('hidden-page');
    FS_UI.updateActiveNav(pageId);
    if (window.innerWidth < 768) FS_UI.sidebar.close();
  },

  updateActiveNav(pageId) {
    document.querySelectorAll('.nav-btn').forEach(btn => {
      const btnPageId = btn.getAttribute('onclick').match(/'([^']+)'/)[1];
      const isActive = btnPageId === pageId;
      btn.classList.toggle('bg-indigo-800', isActive);
      btn.classList.toggle('text-white', isActive);
      btn.classList.toggle('shadow-inner', isActive);
      const svg = btn.querySelector('svg');
      if (svg) {
        svg.classList.toggle('text-white', isActive);
        svg.classList.toggle('text-indigo-400', !isActive);
      }
    });
  },

  sidebar: {
    open: () => {
      document.getElementById('sidebar').classList.remove('-translate-x-full');
      document.getElementById('sidebar-overlay').classList.remove('hidden-page');
    },
    close: () => {
      document.getElementById('sidebar').classList.add('-translate-x-full');
      document.getElementById('sidebar-overlay').classList.add('hidden-page');
    }
  },

  toggleCustomRange() {
    const filter = document.getElementById('time-filter').value;
    const container = document.getElementById('custom-range-container');
    if (filter === 'custom') container.classList.remove('hidden');
    else container.classList.add('hidden');
  },

  // --- Modal Utilities ---
  modal: {
    show(id) {
      const el = document.getElementById(id);
      const card = el.querySelector('div[id$="-card"]');
      el.classList.remove('hidden-page');
      setTimeout(() => {
        el.classList.remove('opacity-0');
        if (card) { card.classList.remove('scale-95'); card.classList.add('scale-100'); }
      }, 10);
    },
    hide(id, callback) {
      const el = document.getElementById(id);
      const card = el.querySelector('div[id$="-card"]');
      el.classList.add('opacity-0');
      if (card) { card.classList.remove('scale-100'); card.classList.add('scale-95'); }
      setTimeout(() => {
        el.classList.add('hidden-page');
        if(typeof callback === 'function') callback(); 
      }, 300);
    },
    loading(title, subtitle, iconType = 'default') {
      document.getElementById('modal-icon-success').classList.add('hidden');
      document.getElementById('modal-icon-error').classList.add('hidden');
      document.getElementById('modal-icon-loading').classList.remove('hidden');
      document.getElementById('modal-loading-bar').classList.remove('hidden');
      
      const icons = {
        login: '<path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15M12 9l-3 3m0 0l3 3m-3-3h12.75" />',
        save: '<path stroke-linecap="round" stroke-linejoin="round" d="M17.593 3.322c1.1.128 1.907 1.077 1.907 2.185V21L12 17.25 4.5 21V5.507c0-1.108.806-2.057 1.907-2.185a48.507 48.507 0 0111.186 0z" />',
        delete: '<path stroke-linecap="round" stroke-linejoin="round" d="M14.74 9l-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 01-2.244 2.077H8.084a2.25 2.25 0 01-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 00-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 013.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 00-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 00-7.5 0" />',
        edit: '<path stroke-linecap="round" stroke-linejoin="round" d="M16.862 4.487l1.687-1.688a1.875 1.875 0 112.652 2.652L6.832 19.82a4.5 4.5 0 01-1.89 1.13l-2.685.8.8-2.685a4.5 4.5 0 011.13-1.89l12.683-12.683z" /><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 7.125L16.862 4.487" />',
        user: '<path stroke-linecap="round" stroke-linejoin="round" d="M19 7.5v3m0 0v3m0-3h3m-3 0h-3m-2.25-4.125a3.375 3.375 0 11-6.75 0 3.375 3.375 0 016.75 0zM4 19.235v-.11a6.375 6.375 0 0112.75 0v.109A12.318 12.318 0 0110.374 21c-2.331 0-4.512-.645-6.374-1.766z" />',
        default: '<path d="M4 22h14a2 2 0 0 0 2-2V7l-5-5H6a2 2 0 0 0-2 2v4"></path><path d="M14 2v4a2 2 0 0 0 2 2h4"></path><path d="M3 15h6"></path><path d="M3 18h6"></path>'
      };
      const svgEl = document.getElementById('modal-loading-svg');
      if (svgEl) {
        svgEl.innerHTML = icons[iconType] || icons['default'];
        if (iconType === 'default') svgEl.classList.add('ml-0.5');
        else svgEl.classList.remove('ml-0.5');
      }

      const titleEl = document.getElementById('loading-title');
      titleEl.className = "text-slate-800 text-xl font-bold mb-1"; 
      titleEl.innerText = title || 'กำลังดำเนินการ';
      document.getElementById('loading-subtitle').innerText = subtitle || 'โปรดรอสักครู่...';
      FS_UI.modal.show('loading-modal');
    },
    success(title, subtitle, callback) {
      document.getElementById('modal-icon-loading').classList.add('hidden');
      document.getElementById('modal-loading-bar').classList.add('hidden');
      document.getElementById('modal-icon-success').classList.remove('hidden');
      const titleEl = document.getElementById('loading-title');
      titleEl.innerText = title || 'สำเร็จ!';
      titleEl.className = "text-emerald-500 text-xl font-bold mb-1";
      document.getElementById('loading-subtitle').innerText = subtitle || '';
      setTimeout(() => FS_UI.modal.hide('loading-modal', callback), 1500);
    },
    error(title, subtitle, callback) {
      document.getElementById('modal-icon-loading').classList.add('hidden');
      document.getElementById('modal-loading-bar').classList.add('hidden');
      document.getElementById('modal-icon-error').classList.remove('hidden');
      const titleEl = document.getElementById('loading-title');
      titleEl.innerText = title || 'เกิดข้อผิดพลาด';
      titleEl.className = "text-rose-500 text-xl font-bold mb-1";
      document.getElementById('loading-subtitle').innerText = subtitle || 'กรุณาลองใหม่อีกครั้ง';
      setTimeout(() => FS_UI.modal.hide('loading-modal', callback), 2000);
    },
    confirm(title, message, onConfirm, confirmText = 'ยืนยัน') {
      document.getElementById('confirm-title').innerText = title;
      document.getElementById('confirm-message').innerText = message;
      const btn = document.getElementById('btn-confirm-action');
      if (btn) btn.innerText = confirmText;
      FS_STATE.currentConfirmAction = onConfirm;
      FS_UI.modal.show('confirm-modal');
    }
  },

  // --- Rendering ---
  render: {
    dashboard() {
      if (!FS_STATE.currentUser) return;
      const filter = document.getElementById('time-filter')?.value || 'this_month';
      const startDate = document.getElementById('dash-start-date')?.value || '';
      const endDate = document.getElementById('dash-end-date')?.value || '';
      
      FS_API.getDashboardData(FS_STATE.currentUser.username, FS_STATE.currentUser.role, filter, startDate, endDate)
        .then(data => {
          document.getElementById('display-balance').innerText = data.balance.toLocaleString(undefined, { minimumFractionDigits: 2 });
          document.getElementById('display-income').innerText = data.totalIncome.toLocaleString(undefined, { minimumFractionDigits: 2 });
          document.getElementById('display-expense').innerText = data.totalExpense.toLocaleString(undefined, { minimumFractionDigits: 2 });
          FS_UI.render.chart(data);
          FS_UI.render.recentTable(data.recentItems);
        });
    },
    recentTable(items) {
      if (items && items.length > 0) {
        items.forEach(it => { FS_STATE.transactions[it.id] = it; });
      }
      const tbody = document.getElementById('recent-table-body');
      tbody.innerHTML = (items && items.length > 0) 
        ? items.map(it => FS_UI.templates.transactionRow(it)).join('')
        : FS_UI.templates.emptyRecentTable();
    },
    history() {
      if (!FS_STATE.currentUser) return;
      const query = document.getElementById('history-search').value;
      const startDate = document.getElementById('history-start-date').value;
      const endDate = document.getElementById('history-end-date').value;
      const tbody = document.getElementById('history-table-body');
      
      tbody.innerHTML = `<tr><td colspan="6" class="px-6 py-12 text-center text-slate-400">กำลังโหลด...</td></tr>`;
      
      FS_API.getHistory(FS_STATE.currentUser.username, FS_STATE.currentUser.role, query, startDate, endDate)
        .then(data => {
          if (data && data.length > 0) {
            data.forEach(it => { FS_STATE.transactions[it.id] = it; });
          }
          tbody.innerHTML = data.length > 0 
            ? data.map(it => FS_UI.templates.historyRow(it)).join('')
            : `<tr><td colspan="6" class="px-6 py-12 text-center text-slate-500">ไม่พบรายการ</td></tr>`;
        });
    },
    users() {
      const role = FS_STATE.currentUser ? FS_STATE.currentUser.role : 'user';
      const addSection = document.getElementById('add-user-section');
      if (addSection) {
        if (role === 'manager') addSection.classList.add('hidden');
        else addSection.classList.remove('hidden');
      }

      FS_API.getUsers(role).then(users => {
        if (users && users.length > 0) {
          users.forEach(u => { FS_STATE.users[u.username] = u; });
        }
        const tbody = document.getElementById('users-table-body');
        tbody.innerHTML = users.length > 0 
          ? users.map(u => FS_UI.templates.userRow(u)).join('')
          : `<tr><td colspan="4" class="px-6 py-12 text-center">ไม่มีข้อมูล</td></tr>`;
      });
    },
    chart(data) {
      const ctx = document.getElementById('financeChart')?.getContext('2d');
      if (!ctx) return;
      if(FS_STATE.chart) FS_STATE.chart.destroy();

      // สร้าง Gradient สำหรับกราฟเส้น
      const gradientIncome = ctx.createLinearGradient(0, 0, 0, 400);
      gradientIncome.addColorStop(0, 'rgba(16, 185, 129, 0.2)');
      gradientIncome.addColorStop(1, 'rgba(16, 185, 129, 0)');

      const gradientExpense = ctx.createLinearGradient(0, 0, 0, 400);
      gradientExpense.addColorStop(0, 'rgba(244, 63, 94, 0.2)');
      gradientExpense.addColorStop(1, 'rgba(244, 63, 94, 0)');

      FS_STATE.chart = new Chart(ctx, {
        type: 'line',
        data: {
          labels: data.labels,
          datasets: [
            { 
              label: 'รายรับ', 
              data: data.income, 
              borderColor: '#10b981', 
              backgroundColor: gradientIncome,
              fill: true,
              tension: 0.4,
              borderWidth: 3,
              pointRadius: 4,
              pointBackgroundColor: '#10b981',
              pointBorderColor: '#fff',
              pointBorderWidth: 2
            },
            { 
              label: 'รายจ่าย', 
              data: data.expense, 
              borderColor: '#f43f5e', 
              backgroundColor: gradientExpense,
              fill: true,
              tension: 0.4,
              borderWidth: 3,
              pointRadius: 4,
              pointBackgroundColor: '#f43f5e',
              pointBorderColor: '#fff',
              pointBorderWidth: 2
            }
          ]
        },
        options: { 
          responsive: true, 
          maintainAspectRatio: false, 
          interaction: {
            intersect: false,
            mode: 'index',
          },
          scales: { 
            y: { 
              beginAtZero: true,
              grid: {
                color: 'rgba(0, 0, 0, 0.05)',
                drawBorder: false
              },
              ticks: {
                callback: function(value) { return '฿' + value.toLocaleString(); },
                font: { family: 'Prompt' }
              }
            },
            x: {
              grid: {
                display: false
              },
              ticks: { font: { family: 'Prompt' } }
            }
          },
          plugins: {
            legend: {
              position: 'top',
              align: 'end',
              labels: {
                boxWidth: 8,
                usePointStyle: true,
                pointStyle: 'circle',
                font: { family: 'Prompt', size: 12, weight: '600' }
              }
            },
            tooltip: {
              backgroundColor: 'rgba(255, 255, 255, 0.9)',
              titleColor: '#1e293b',
              bodyColor: '#1e293b',
              borderColor: '#e2e8f0',
              borderWidth: 1,
              titleFont: { family: 'Prompt', size: 14, weight: 'bold' },
              bodyFont: { family: 'Prompt', size: 13 },
              padding: 12,
              displayColors: true,
              callbacks: {
                label: function(context) {
                  let label = context.dataset.label || '';
                  if (label) label += ': ';
                  if (context.parsed.y !== null) label += '฿' + context.parsed.y.toLocaleString();
                  return label;
                }
              }
            }
          }
        }
      });
    }
  },

  // --- Templates ---
  templates: {
    transactionRow(item) {
      const isIncome = item.type === 'income';
      const role = FS_STATE.currentUser.role;
      let actions = `<button onclick="FS_HANDLERS.showDetail('${item.id}')" class="text-indigo-600 font-bold text-xs p-2 hover:bg-indigo-50 rounded-lg">ดูข้อมูล</button>`;
      if (['admin', 'manager'].includes(role)) {
        actions += `<button onclick="FS_HANDLERS.openEditModal('${item.id}')" class="ml-2 text-amber-600 font-bold text-xs p-2 hover:bg-amber-50 rounded-lg">แก้ไข</button>`;
        actions += `<button onclick='FS_HANDLERS.voidTransaction("${item.id}")' class="ml-2 text-rose-600 font-bold text-xs p-2 hover:bg-rose-50 rounded-lg">ยกเลิก</button>`;
      }
      return `
        <tr class="hover:bg-slate-50/80 transition">
          <td class="px-6 py-4 text-slate-500">${FS_UTILS.formatDate(item.date)}</td>
          <td class="px-6 py-4 font-medium">${item.description}</td>
          <td class="px-6 py-4"><span class="px-2.5 py-1 rounded-full text-xs font-bold ${isIncome ? 'bg-emerald-100 text-emerald-600' : 'bg-rose-100 text-rose-600'}">${isIncome ? 'รายรับ' : 'รายจ่าย'}</span></td>
          <td class="px-6 py-4 text-right font-bold ${isIncome ? 'text-emerald-600' : 'text-rose-600'}">${isIncome ? '+' : '-'}${item.amount.toLocaleString(undefined, { minimumFractionDigits: 2 })}</td>
          <td class="px-6 py-4 text-center">${actions}</td>
        </tr>`;
    },
    historyRow(item) {
      const isIncome = item.type === 'income';
      const role = FS_STATE.currentUser.role;
      let actions = `<button onclick="FS_HANDLERS.showDetail('${item.id}')" class="text-indigo-600 font-bold text-xs p-2">ดูข้อมูล</button>`;
      if (['admin', 'manager'].includes(role)) {
        actions += `<button onclick="FS_HANDLERS.openEditModal('${item.id}')" class="ml-1 text-amber-600 font-bold text-xs p-2">แก้ไข</button>`;
        actions += `<button onclick='FS_HANDLERS.voidTransaction("${item.id}")' class="ml-1 text-rose-600 font-bold text-xs p-2">ยกเลิก</button>`;
      }
      return `
        <tr class="border-b border-slate-50">
          <td class="px-6 py-4 text-slate-500">${FS_UTILS.formatDate(item.date)}</td>
          <td class="px-6 py-4 font-mono text-xs text-slate-400">${item.id}</td>
          <td class="px-6 py-4 font-medium">${item.description}</td>
          <td class="px-6 py-4"><span class="px-2 py-1 rounded-full text-[10px] font-bold ${isIncome ? 'bg-emerald-100 text-emerald-600' : 'bg-rose-100 text-rose-600'}">${isIncome ? 'รายรับ' : 'รายจ่าย'}</span></td>
          <td class="px-6 py-4 text-right font-bold ${isIncome ? 'text-emerald-600' : 'text-rose-600'}">${item.amount.toLocaleString(undefined, { minimumFractionDigits: 2 })}</td>
          <td class="px-6 py-4 text-center">${actions}</td>
        </tr>`;
    },
    userRow(user) {
      const badges = { admin: 'purple', manager: 'blue', user: 'slate' };
      const color = badges[user.role] || 'slate';
      const currentUserRole = FS_STATE.currentUser ? FS_STATE.currentUser.role : 'user';
      let actionBtn = '';
      if (currentUserRole === 'admin') {
        actionBtn = `<button onclick="FS_HANDLERS.openEditUserModal('${user.username}')" class="text-amber-600 font-bold text-xs p-2 hover:bg-amber-50 rounded-lg">แก้ไข</button>`;
      }
      return `
        <tr>
          <td class="px-6 py-4 font-medium">${user.name}</td>
          <td class="px-6 py-4 text-slate-500">${user.username}</td>
          <td class="px-6 py-4"><span class="px-2 py-1 bg-${color}-100 text-${color}-700 rounded text-xs font-bold uppercase">${user.role}</span></td>
          <td class="px-6 py-4 text-right">${actionBtn}</td>
        </tr>`;
    },
    emptyRecentTable() {
      return `<tr><td colspan="5" class="px-6 py-12 text-center text-slate-400 font-medium italic">ยังไม่มีรายการบันทึก</td></tr>`;
    }
  }
};
</script>
