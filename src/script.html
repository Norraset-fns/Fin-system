<script>
  let currentUser = null;
    let myChart = null;

    // --- Sidebar Mobile Toggle ---
    function openSidebar() {
      document.getElementById('sidebar').classList.remove('-translate-x-full');
      document.getElementById('sidebar-overlay').classList.remove('hidden-page');
    }
    
    function closeSidebar() {
      document.getElementById('sidebar').classList.add('-translate-x-full');
      document.getElementById('sidebar-overlay').classList.add('hidden-page');
    }

// ==========================================
  // --- Loading Alert Control ---
  // ==========================================
  function showLoading(title, subtitle) {
    // ซ่อนไอคอน Success และ Error, แสดงไอคอน Loading
    document.getElementById('modal-icon-success').classList.add('hidden');
    document.getElementById('modal-icon-error').classList.add('hidden'); // เพิ่มการซ่อน Error
    document.getElementById('modal-icon-loading').classList.remove('hidden');
    document.getElementById('modal-loading-bar').classList.remove('hidden');
    
    document.getElementById('loading-title').className = "text-slate-800 text-xl font-bold mb-1"; 
    document.getElementById('loading-title').innerText = title || 'กำลังดำเนินการ';
    document.getElementById('loading-subtitle').innerText = subtitle || 'โปรดรอสักครู่...';
    
    const modal = document.getElementById('loading-modal');
    const card = document.getElementById('loading-card');
    
    modal.classList.remove('hidden-page');
    setTimeout(() => {
      modal.classList.remove('opacity-0');
      card.classList.remove('scale-95');
      card.classList.add('scale-100');
    }, 10);
  }

  // เพิ่มฟังก์ชันใหม่ สำหรับโชว์ว่าทำงานผิดพลาด
  function showError(title, subtitle, callback) {
    // ซ่อน Loading, แสดง Error
    document.getElementById('modal-icon-loading').classList.add('hidden');
    document.getElementById('modal-loading-bar').classList.add('hidden');
    document.getElementById('modal-icon-error').classList.remove('hidden');
    
    document.getElementById('loading-title').innerText = title || 'เกิดข้อผิดพลาด';
    document.getElementById('loading-title').className = "text-rose-500 text-xl font-bold mb-1"; // เปลี่ยนหัวข้อเป็นสีแดง
    document.getElementById('loading-subtitle').innerText = subtitle || 'กรุณาลองใหม่อีกครั้ง';

    // ตั้งเวลาปิดหน้าต่างอัตโนมัติ (ให้เวลานานนิดนึง 2 วินาที จะได้อ่านทัน)
    setTimeout(() => {
      hideLoading(callback);
    }, 2000);
  }

  // เพิ่มฟังก์ชันใหม่ สำหรับโชว์ว่าสำเร็จแล้วปิดเอง
  function showSuccess(title, subtitle, callback) {
    // 2. เปลี่ยนเป็นสถานะ Success (ซ่อนหมุนๆ, แสดงติ๊กถูก)
    document.getElementById('modal-icon-loading').classList.add('hidden');
    document.getElementById('modal-loading-bar').classList.add('hidden');
    document.getElementById('modal-icon-success').classList.remove('hidden');
    
    document.getElementById('loading-title').innerText = title || 'สำเร็จ!';
    document.getElementById('loading-title').className = "text-emerald-500 text-xl font-bold mb-1"; // เปลี่ยนหัวข้อเป็นสีเขียว
    document.getElementById('loading-subtitle').innerText = subtitle || '';

    // ตั้งเวลาปิดหน้าต่างอัตโนมัติใน 1.5 วินาที
    setTimeout(() => {
      hideLoading(callback);
    }, 1500);
  }

  function hideLoading(callback) {
    const modal = document.getElementById('loading-modal');
    const card = document.getElementById('loading-card');
    
    modal.classList.add('opacity-0');
    card.classList.remove('scale-100');
    card.classList.add('scale-95');
    
    setTimeout(() => {
      modal.classList.add('hidden-page');
      if(typeof callback === 'function') callback(); 
    }, 300);
  }

  // ==========================================
  // --- อัปเดตฟังก์ชันการทำงาน (ไร้ alert ธรรมดา) ---
  // ==========================================

  function submitTransaction(e) {
    e.preventDefault();
    const formData = {
      type: document.querySelector('input[name="txType"]:checked').value,
      date: document.getElementById('txDate').value,
      description: document.getElementById('txDesc').value,
      amount: document.getElementById('txAmount').value,
      username: currentUser.username
    };

    showLoading('กำลังบันทึกข้อมูล', 'จัดเก็บรายรับ-รายจ่ายลงระบบ...');

    google.script.run.withSuccessHandler(function(res) {
      if(res.success) {
        // แทนที่ alert() ด้วย showSuccess()
        showSuccess('บันทึกสำเร็จ!', res.message, function() {
          document.getElementById('tx-form').reset();
        });
      } else {
          // ใช้ showError แทน alert 
         showError('บันทึกไม่สำเร็จ', res.message);
      }
    }).saveTransaction(formData);
  }

  function submitReceipt(e) {
    e.preventDefault();
    const items = [];
    document.querySelectorAll('.receipt-item').forEach(row => {
      items.push({
        name: row.querySelector('.item-name').value,
        price: row.querySelector('.item-price').value,
        qty: row.querySelector('.item-qty').value
      });
    });

    const formData = {
      date: document.getElementById('rcDate').value,
      shopName: document.getElementById('rcShop').value,
      items: JSON.stringify(items),
      username: currentUser.username
    };

    showLoading('กำลังบันทึกใบเสร็จ', 'จัดเก็บรายการสินค้าลงระบบ...');

    google.script.run.withSuccessHandler(function(res) {
      if(res.success) {
        // แทนที่ alert() ด้วย showSuccess()
        showSuccess('บันทึกใบเสร็จสำเร็จ!', 'ข้อมูลใบเสร็จถูกจัดเก็บแล้ว', function() {
          document.getElementById('receipt-form').reset();
          resetReceiptRows();
        });
      } else {
          // 🔴 ใช้ showError แทน alert 
        showError('บันทึกไม่สำเร็จ', res.message);
      }
    }).saveReceipt(formData);
  }
  // --- Onboarding Control ---
  function showOnboarding(forced = false) {
    const hasSeen = localStorage.getItem('finsystem-onboarding-seen');
    if (hasSeen && !forced) return;

    const modal = document.getElementById('onboarding-modal');
    const card = document.getElementById('onboarding-card');

    modal.classList.remove('hidden-page');
    setTimeout(() => {
      modal.classList.remove('opacity-0');
      card.classList.remove('scale-95');
      card.classList.add('scale-100');
    }, 10);
  }

  function closeOnboarding() {
    localStorage.setItem('finsystem-onboarding-seen', 'true');
    const modal = document.getElementById('onboarding-modal');
    const card = document.getElementById('onboarding-card');

    modal.classList.add('opacity-0');
    card.classList.remove('scale-100');
    card.classList.add('scale-95');
    setTimeout(() => modal.classList.add('hidden-page'), 500);
  }

  // แก้ไขฟังก์ชัน login ให้เรียก Onboarding
  function login() {
    const user = document.getElementById('username').value;
    const pass = document.getElementById('password').value;

    // ถ้ากรอกไม่ครบ ให้เด้ง showError เลย
    if (!user || !pass) return showError('ข้อมูลไม่ครบถ้วน', 'กรุณากรอก Username และ Password');

    showLoading('กำลังเข้าสู่ระบบ', 'ตรวจสอบข้อมูลประจำตัว...');

    google.script.run.withSuccessHandler(function (response) {
      if (response.success) {

        // ถ้าล็อกอินถูก โชว์ Success แล้วค่อยเปลี่ยนหน้า
        showSuccess('เข้าสู่ระบบสำเร็จ', 'กำลังเตรียมหน้าแดชบอร์ด...', function () {
          currentUser = response.data;
          document.getElementById('user-name').innerText = currentUser.name;
          document.getElementById('user-role').innerText = currentUser.role;

          // ซ่อนข้อความ Error สีแดงใต้ฟอร์ม (ถ้ามีค้างอยู่)
          document.getElementById('login-error').style.display = 'none';

          document.getElementById('sidebar').classList.remove('hidden-page');
          document.getElementById('mobile-header').classList.remove('hidden-page');

          setupMenuAccess();
          if (currentUser.role === 'admin' || currentUser.role === 'manager') navigate('dashboard');
          else navigate('transaction');

          // 🆕 เช็กการเปิด Onboarding ครั้งแรก
          setTimeout(() => showOnboarding(), 1000);
        });

      } else {
        // ถ้าล็อกอินผิด โชว์ Error Popup
        showError('เข้าสู่ระบบล้มเหลว', response.message);
      }
    }).authenticate(user, pass);
  }

    function logout() {
      currentUser = null;
      // ซ่อน Sidebar และ Mobile Header เมื่อออกจากระบบ
      document.getElementById('sidebar').classList.add('hidden-page');
      document.getElementById('mobile-header').classList.add('hidden-page');
      
      document.getElementById('username').value = '';
      document.getElementById('password').value = '';
      closeSidebar(); // ปิดเมนูบนมือถือถ้าเปิดค้างไว้
      navigate('login');
    }

    // --- Navigation & Role Control ---
    function navigate(pageId) {
      const pages = ['page-login', 'page-dashboard', 'page-history', 'page-transaction', 'page-receipt', 'page-users'];

      if(pageId === 'dashboard') loadDashboard();
      if(pageId === 'history') loadHistory();
      if(pageId === 'users') loadUsers();

      pages.forEach(p => document.getElementById(p).classList.add('hidden-page'));
      document.getElementById('page-' + pageId).classList.remove('hidden-page');
      
      // Update Active Button Style
      document.querySelectorAll('.nav-btn').forEach(btn => {
        // Extract the pageId from the onclick attribute
        const btnPageId = btn.getAttribute('onclick').match(/'([^']+)'/)[1];
        if (btnPageId === pageId) {
          btn.classList.add('bg-indigo-800', 'text-white', 'shadow-inner');
          btn.querySelector('svg').classList.add('text-white');
          btn.querySelector('svg').classList.remove('text-indigo-400');
        } else {
          btn.classList.remove('bg-indigo-800', 'text-white', 'shadow-inner');
          btn.querySelector('svg').classList.remove('text-white');
          btn.querySelector('svg').classList.add('text-indigo-400');
        }
      });

      if (window.innerWidth < 768) {
        closeSidebar();
      }
    }

    function setupMenuAccess() {
      const btns = document.querySelectorAll('.nav-btn');
      btns.forEach(btn => {
        const allowedRoles = btn.getAttribute('data-role').split(' ');
        if (allowedRoles.includes(currentUser.role)) {
          btn.style.display = 'flex'; // แสดงแบบ flex เพื่อให้ไอคอนจัดเรียงกับข้อความ
        } else {
          btn.style.display = 'none';
        }
      });
    }

    // --- Dashboard & Data ---
    // --- Dashboard Update ---
    function loadDashboard() {
      if (!currentUser) return; // ถ้ายังไม่ล็อกอิน ให้หยุดทำงาน

      // 1. ดึงค่าตัวกรองเวลาจาก Dropdown
      const filterElement = document.getElementById('time-filter');
      const filterValue = filterElement ? filterElement.value : 'this_month';

      // 2. ส่งค่า username, role และ filterValue ไปให้หลังบ้าน
      google.script.run.withSuccessHandler(function (data) {

        // อัปเดตยอดเงินรวม
        document.getElementById('display-balance').innerText = data.balance.toLocaleString(undefined, { minimumFractionDigits: 2 });
        document.getElementById('display-income').innerText = data.income[0].toLocaleString(undefined, { minimumFractionDigits: 2 });
        document.getElementById('display-expense').innerText = data.expense[0].toLocaleString(undefined, { minimumFractionDigits: 2 });

        // อัปเดตกราฟ
        renderChart(data);

        // อัปเดตตาราง
        const tbody = document.getElementById('recent-table-body');
        tbody.innerHTML = '';

        if (!data.recentItems || data.recentItems.length === 0) {
          tbody.innerHTML = `
        <tr>
          <td colspan="5" class="px-6 py-12 text-center">
            <div class="flex flex-col items-center">
              <div class="p-4 bg-slate-50 rounded-full mb-4">
                <svg class="w-12 h-12 text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path></svg>
              </div>
              <h4 class="text-slate-800 font-bold mb-1">ยังไม่มีรายการบันทึก</h4>
              <p class="text-slate-500 text-sm mb-6">เริ่มบันทึกรายรับหรือรายจ่ายรายการแรกของคุณเลย!</p>
              <button onclick="navigate('transaction')" class="bg-indigo-600 text-white px-6 py-2 rounded-xl text-sm font-bold shadow-lg shadow-indigo-100 hover:bg-indigo-700 transition">เพิ่มรายการใหม่</button>
            </div>
          </td>
        </tr>
      `;
        } else {
          // --- แก้ไขใน loadDashboard() ตรงส่วนวนลูปตาราง ---
          data.recentItems.forEach(item => {
            const isIncome = item.type === 'income';

            // 🛠️ เพิ่มเงื่อนไขเช็กสิทธิ์: ถ้าเป็น admin/manager ให้มีปุ่มยกเลิกเพิ่มขึ้นมา
            let actionButtons = `<button onclick='showDetail(${JSON.stringify(item)})' class="text-indigo-600 hover:text-indigo-800 font-bold text-xs p-2 hover:bg-indigo-50 rounded-lg transition">ดูข้อมูล</button>`;

            if (currentUser.role === 'admin' || currentUser.role === 'manager') {
              // เพิ่มปุ่มแก้ไข (สีส้ม)
              actionButtons += `<button onclick='openEditModal(${JSON.stringify(item)})' class="ml-2 text-amber-600 hover:text-amber-800 font-bold text-xs p-2 hover:bg-amber-50 rounded-lg transition">แก้ไข</button>`;

              // ปุ่มยกเลิก (มีอยู่แล้ว)
              actionButtons += `<button onclick='voidTransaction("${item.id}")' class="ml-2 text-rose-600 hover:text-rose-800 font-bold text-xs p-2 hover:bg-rose-50 rounded-lg transition">ยกเลิก</button>`;
            }

            const row = `
        <tr class="hover:bg-slate-50/80 transition">
          <td class="px-6 py-4 text-slate-500">${formatDate(item.date)}</td>
          <td class="px-6 py-4 font-medium text-slate-700">${item.description}</td>
          <td class="px-6 py-4">
            <span class="px-2.5 py-1 rounded-full text-xs font-bold ${isIncome ? 'bg-emerald-100 text-emerald-600' : 'bg-rose-100 text-rose-600'}">
              ${isIncome ? 'รายรับ' : 'รายจ่าย'}
            </span>
          </td>
          <td class="px-6 py-4 text-right font-bold ${isIncome ? 'text-emerald-600' : 'text-rose-600'}">
            ${isIncome ? '+' : '-'}${item.amount.toLocaleString(undefined, { minimumFractionDigits: 2 })}
          </td>
          <td class="px-6 py-4 text-center">
            ${actionButtons} 
          </td>
           
        </tr>
      `;
            tbody.insertAdjacentHTML('beforeend', row);
          });
        }

        // 🔴 ส่งพัสดุ 3 ชิ้นไปให้ Code.gs (ห้ามลบเด็ดขาด)
      }).getDashboardData(currentUser.username, currentUser.role, filterValue);
    }

    // --- History Page Data ---
    function loadHistory() {
      if (!currentUser) return;
      
      const searchQuery = document.getElementById('history-search').value;
      const tbody = document.getElementById('history-table-body');
      
      // แสดง Loading ในตารางขณะรอข้อมูล
      tbody.innerHTML = `<tr><td colspan="6" class="px-6 py-12 text-center text-slate-400">กำลังโหลดข้อมูลประวัติ...</td></tr>`;

      google.script.run.withSuccessHandler(function(historyData) {
        tbody.innerHTML = '';
        
        if (!historyData || historyData.length === 0) {
          tbody.innerHTML = `<tr><td colspan="6" class="px-6 py-12 text-center text-slate-500 font-medium">ไม่พบรายการที่ตรงกับเงื่อนไขการค้นหา</td></tr>`;
          return;
        }

        historyData.forEach(item => {
          const isIncome = item.type === 'income';
          
          let actionButtons = `<button onclick='showDetail(${JSON.stringify(item)})' class="text-indigo-600 hover:text-indigo-800 font-bold text-xs p-2 hover:bg-indigo-50 rounded-lg transition">ดูข้อมูล</button>`;

          if (currentUser.role === 'admin' || currentUser.role === 'manager') {
            actionButtons += `<button onclick='openEditModal(${JSON.stringify(item)})' class="ml-1 text-amber-600 hover:text-amber-800 font-bold text-xs p-2 hover:bg-amber-50 rounded-lg transition">แก้ไข</button>`;
            actionButtons += `<button onclick='voidTransaction("${item.id}")' class="ml-1 text-rose-600 hover:text-rose-800 font-bold text-xs p-2 hover:bg-rose-50 rounded-lg transition">ยกเลิก</button>`;
          }

          tbody.insertAdjacentHTML('beforeend', `
            <tr class="hover:bg-slate-50 transition border-b border-slate-50">
              <td class="px-6 py-4 text-slate-500">${formatDate(item.date)}</td>
              <td class="px-6 py-4 font-mono text-xs text-slate-400">${item.id}</td>
              <td class="px-6 py-4 font-medium text-slate-700">${item.description}</td>
              <td class="px-6 py-4">
                <span class="px-2 py-1 rounded-full text-[10px] font-bold ${isIncome ? 'bg-emerald-100 text-emerald-600' : 'bg-rose-100 text-rose-600'}">
                  ${isIncome ? 'รายรับ' : 'รายจ่าย'}
                </span>
              </td>
              <td class="px-6 py-4 text-right font-bold ${isIncome ? 'text-emerald-600' : 'text-rose-600'}">
                ${item.amount.toLocaleString(undefined, { minimumFractionDigits: 2 })}
              </td>
              <td class="px-6 py-4 text-center">
                ${actionButtons}
              </td>
            </tr>
          `);
        });
      }).getTransactionsHistory(currentUser.username, currentUser.role, searchQuery);
    }

    // --- Helpers ---
    function addReceiptItem() {
      const container = document.getElementById('receipt-items-container');
      const row = document.createElement('div');
      row.className = 'flex flex-wrap md:flex-nowrap gap-2 items-center receipt-item bg-white p-3 rounded-xl border border-slate-100 shadow-sm animate-in zoom-in-95 duration-200';
      row.innerHTML = `
        <input type="text" class="item-name flex-1 min-w-[150px] px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="รายการ" required>
        <input type="number" class="item-price w-28 px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="ราคา" required>
        <input type="number" class="item-qty w-20 px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none" value="1" required>
        <button type="button" onclick="this.parentElement.remove()" class="text-rose-400 hover:text-rose-600 p-2 transition">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
        </button>
      `;
      container.appendChild(row);
    }

    function resetReceiptRows() {
      const container = document.getElementById('receipt-items-container');
      container.innerHTML = '';
      addReceiptItem();
    }

// --- Detail Modal Control ---
function showDetail(item) {
  const content = document.getElementById('detail-content');
  const isIncome = item.type === 'income';
  const isReceipt = item.itemsData ? true : false;
  
  // 1. ตรวจสอบว่ามีข้อมูลรายการสินค้า (itemsData) แนบมาไหม
  let itemsHtml = '';
  let displayDescription = item.description;

  if (isReceipt) {
    // ถ้าเป็นใบเสร็จ และคำอธิบายขึ้นต้นด้วย "ใบเสร็จ: " ให้ตัดออกเพื่อความสวยงาม
    displayDescription = displayDescription.replace(/^ใบเสร็จ:\s*/, '');
    
    try {
      const itemsList = JSON.parse(item.itemsData);
      if (itemsList.length > 0) {
        let trs = '';
        itemsList.forEach(it => {
          const rowTotal = parseFloat(it.price) * parseInt(it.qty);
          trs += `
            <tr class="border-b border-slate-100 last:border-0 hover:bg-slate-50/50 transition">
              <td class="py-3 text-slate-700 text-sm font-medium">${it.name}</td>
              <td class="py-3 text-center text-slate-500 text-sm">x${it.qty}</td>
              <td class="py-3 text-right text-slate-900 font-bold text-sm">฿${rowTotal.toLocaleString(undefined, {minimumFractionDigits: 2})}</td>
            </tr>
          `;
        });
        
        itemsHtml = `
          <div class="pt-6 border-t border-slate-100">
            <p class="text-[10px] font-black text-slate-400 uppercase tracking-[0.2em] mb-3">รายละเอียดสินค้าในใบเสร็จ</p>
            <div class="bg-slate-50/50 rounded-2xl border border-slate-100 overflow-hidden">
              <table class="w-full text-sm">
                <thead class="bg-slate-100/50">
                  <tr class="text-left text-slate-500 text-[10px] uppercase tracking-wider border-b border-slate-200">
                    <th class="px-4 py-2 font-bold">ชื่อสินค้า</th>
                    <th class="px-4 py-2 text-center font-bold w-16">จำนวน</th>
                    <th class="px-4 py-2 text-right font-bold w-24">รวม</th>
                  </tr>
                </thead>
                <tbody class="px-4">
                  ${trs}
                </tbody>
              </table>
            </div>
          </div>
        `;
      }
    } catch(e) {
      console.log("ไม่มีข้อมูลสินค้ารูปแบบ JSON หรือแปลงข้อมูลไม่สำเร็จ");
    }
  }

// --- ฟังก์ชันสำหรับวาดกราฟ (Chart.js) ---
function renderChart(data) {
  const chartCanvas = document.getElementById('financeChart');
  
  // เช็กก่อนว่ามีพื้นที่ให้วาดกราฟไหม (เผื่อหน้าเว็บยังโหลดไม่เสร็จ)
  if (!chartCanvas) return; 

  const ctx = chartCanvas.getContext('2d');
  
  // ลบกราฟเก่าทิ้งก่อนถ้าวาดใหม่ ไม่งั้นกราฟจะซ้อนกันจนบัค
  if(myChart) myChart.destroy();
  
  myChart = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: data.labels,
      datasets: [
        {
          label: 'รายรับ',
          data: data.income,
          backgroundColor: '#10b981', // สีเขียว Emerald
          borderRadius: 4
        },
        {
          label: 'รายจ่าย',
          data: data.expense,
          backgroundColor: '#f43f5e', // สีแดง Rose
          borderRadius: 4
        }
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { position: 'top', labels: { font: { family: 'Prompt' } } }
      },
      scales: {
        y: { beginAtZero: true, grid: { color: '#f1f5f9' } },
        x: { grid: { display: false } }
      }
    }
  });
}
// --- ฟังก์ชันล็อกวันที่ ไม่ให้เลือกอนาคต ---
  function lockFutureDates() {
    const today = new Date();
    
    // แปลงก้อนเวลาให้เป็นรูปแบบ YYYY-MM-DD (เช่น 2026-05-01) ซึ่งเป็นรูปแบบที่ HTML เข้าใจ
    const year = today.getFullYear();
    const month = String(today.getMonth() + 1).padStart(2, '0');
    const day = String(today.getDate()).padStart(2, '0');
    const todayFormatted = `${year}-${month}-${day}`;
    
    // ไปจับตัวช่องกรอกวันที่ทั้ง 2 หน้า แล้วใส่คำสั่ง max
    const txDateInput = document.getElementById('txDate');
    const rcDateInput = document.getElementById('rcDate');
    
    if (txDateInput) txDateInput.max = todayFormatted;
    if (rcDateInput) rcDateInput.max = todayFormatted;
  }

// ฟังก์ชันช่วยจัดรูปแบบวันที่
function formatDate(dateStr) {
  if(!dateStr) return '-';
  const d = new Date(dateStr);
  return d.toLocaleDateString('th-TH', { day: '2-digit', month: 'short', year: '2-digit' });
}

    function loadUsers() {
      google.script.run.withSuccessHandler(function (usersList) {
        const tbody = document.getElementById('users-table-body');
        tbody.innerHTML = '';

        if (!usersList || usersList.length === 0) {
          tbody.innerHTML = `
        <tr>
          <td colspan="4" class="px-6 py-12 text-center text-slate-500">
            ยังไม่มีผู้ใช้งานอื่นในระบบ
          </td>
        </tr>
      `;
          return;
        }

        usersList.forEach(user => {
      // ทำสีป้าย Role ให้ดูง่ายๆ
      let roleBadge = '';
      if(user.role === 'admin') roleBadge = '<span class="px-2 py-1 bg-purple-100 text-purple-700 rounded text-xs font-bold">Admin</span>';
      else if(user.role === 'manager') roleBadge = '<span class="px-2 py-1 bg-blue-100 text-blue-700 rounded text-xs font-bold">Manager</span>';
      else roleBadge = '<span class="px-2 py-1 bg-slate-100 text-slate-700 rounded text-xs font-bold">User</span>';

      tbody.insertAdjacentHTML('beforeend', `
        <tr class="hover:bg-slate-50 transition">
          <td class="px-6 py-4 font-medium text-slate-700">${user.name}</td>
          <td class="px-6 py-4 text-slate-500">${user.username}</td>
          <td class="px-6 py-4">${roleBadge}</td>
          <td class="px-6 py-4 text-right">
            <button onclick='openEditUserModal(${JSON.stringify(user)})' class="text-amber-600 hover:text-amber-800 font-bold text-xs p-2 hover:bg-amber-50 rounded-lg transition">แก้ไข</button>
          </td>
        </tr>
      `);
    });
  }).getUsers(); // ไปเรียกฟังก์ชัน getUsers ใน Code.gs
}

  }

  function closeConfirmModal() {
    const modal = document.getElementById('confirm-modal');
    const card = document.getElementById('confirm-card');
    modal.classList.add('opacity-0');
    card.classList.remove('scale-100');
    card.classList.add('scale-95');

  });

  // --- Hotkeys System ---
  function setupHotkeys() {
    window.addEventListener('keydown', function(e) {
      // ปิด Modal ทุกชนิดด้วยปุ่ม Esc
      if (e.key === 'Escape') {
        closeDetail();
        closeEditModal();
        closeEditUserModal();
        closeConfirmModal();
        closeOnboarding();
        if (window.innerWidth < 768) closeSidebar();
      }

      // Hotkeys สำหรับสลับหน้า (Alt + Key)
      if (e.altKey) {
        switch(e.key.toLowerCase()) {
          case 'd': // Alt + D -> Dashboard
            if (currentUser && (currentUser.role === 'admin' || currentUser.role === 'manager')) {
              e.preventDefault();
              navigate('dashboard');
            }
            break;
          case 'n': // Alt + N -> New Transaction
            if (currentUser) {
              e.preventDefault();
              navigate('transaction');
            }
            break;
          case 'r': // Alt + R -> New Receipt
            if (currentUser) {
              e.preventDefault();
              navigate('receipt');
            }
            break;
          case 'u': // Alt + U -> User Management
            if (currentUser && currentUser.role === 'admin') {
              e.preventDefault();
              navigate('users');
            }
            break;
        }
      }
    });
  }

  // สั่งให้ฟังก์ชันเหล่านี้ทำงานเมื่อโหลดหน้าเว็บ
  document.addEventListener('DOMContentLoaded', function() {
    lockFutureDates();
    setupHotkeys();
  });
